<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>NutriKit Food Planner</title>
    <meta name="description" content="Second web assignment">
    <meta name="author" content="Cristina Peniston">
    <link rel="stylesheet" href="nutrikit.css">
</head>
<body>
    <h1>NutriKit food planner</h1>
    <h3>NutriKit allows you to select your groceries, and track your nutritional progress (good or bad)</h3>
    
    <div class="container">
        <div class="column"><p>Categories</p></div>
        <div class="column"><p>Menu Items</p></div>
        <div class="column"></div>
        <div class="column"><p>Selected Items</p></div>
    
        <div class="column">
            <select id="category">
                <option value="" disabled selected>Select a category</option>
                <option value="proteins">Proteins</option>
                <option value="fruits">Fruits</option>
                <option value="vegetables">Vegetables</option>
                <option value="dairy">Dairy</option>
                <option value="grains">Grains</option>
            </select>
        </div>
    
        <div class="column">
            <select id="menu-items" size="5"></select>
        </div>
    
        <div class="column button-column">
            <button id="add-remove">&gt;&gt;</button>
        </div>
    
        <div class="column">
            <select id="selected-items" size="5"></select>
            <span id="total-calories"></span>
        </div>
    </div>    
    
    <script src="nutrikit.js"></script>
</body>
</html>
