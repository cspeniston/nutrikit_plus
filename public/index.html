<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>SWEN-344 Web Assignment 0</title>
    <meta name="description" content="First web assignment">
    <meta name="author" content="Cristina Peniston">
    <script>
        function updateTextColor() {
            var selectedFood = document.getElementById("foodSelect").value;
            var selectedColor = document.querySelector('input[name="colorRadio"]:checked');
            var textArea = document.getElementById("foodTextArea");
            
            if (selectedFood) {
                textArea.value = selectedFood;
            }
            
            if (selectedColor) {
                textArea.style.color = selectedColor.value;
            }
        }
    </script>
</head>
<body style="font-family: 'Segoe UI'; text-align: center;">
    <h1 style="font-family: Verdana; font-weight: bold; font-size: 36px; text-align: center;">SWEN-344 Web Assignment 0</h1>
    <h2 style="font-family: Impact; text-align: center;">Section 01</h2>
    
    <select id="foodSelect" onchange="updateTextColor()" style="display: block; margin: 10px auto;">
        <option value="">--Select One!!--</option>
        <option value="Protein">Protein</option>
        <option value="Carbs">Carbs</option>
        <option value="Fruits">Fruits</option>
        <option value="Vegetables">Vegetables</option>
        <option value="Sweets">Sweets</option>
    </select>
    
    <div style="margin: 10px; text-align: center;">
        <div style="display: inline-block; text-align: left;">
            <input type="radio" name="colorRadio" value="Black" onclick="updateTextColor()"> Black<br>
            <input type="radio" name="colorRadio" value="Red" onclick="updateTextColor()"> Red<br>
            <input type="radio" name="colorRadio" value="Green" onclick="updateTextColor()"> Green<br>
            <input type="radio" name="colorRadio" value="Blue" onclick="updateTextColor()"> Blue<br>
            <input type="radio" name="colorRadio" value="Purple" onclick="updateTextColor()"> Purple
        </div>
    </div>
    
    <textarea id="foodTextArea" rows="4" cols="40" style="resize: none; display: block; margin: 10px auto;">Food Type...</textarea>
</body>
</html>
